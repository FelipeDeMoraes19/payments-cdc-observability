version: 2

sources:
  - name: silver
    description: >
      Cleaned change log written by the Spark job. One row per change, not per key,
      with is_current marking the version that survived last.
    meta:
      external_location: "{{ env_var('SILVER_ROOT', '../../data/silver') }}/{name}/*.parquet"
    tables:
      - name: customers
      - name: merchants
      - name: payments
        description: >
          Freshness is measured on created_at, the business event time, not on the
          moment of ingestion. A pipeline that keeps reprocessing a source that died
          would look fresh under ingested_at; whether the pipeline is running at all
          is what the heartbeat alert answers, and asking it twice adds nothing.

          The threshold has a floor: this pipeline batches bronze every 60s and
          rebuilds silver in about 50s, so data is never newer than roughly two
          minutes by the time it is visible here. A freshness threshold under that
          reports stale forever, which is as useless as never reporting at all.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: "{{ var('freshness_warn_minutes', 10) }}", period: minute}
          error_after: {count: "{{ var('freshness_error_minutes', 30) }}", period: minute}

  - name: bronze
    description: Exchange rates land already typed, so gold reads them from bronze.
    meta:
      external_location: "{{ env_var('FX_BRONZE_ROOT', '../../data/bronze/fx') }}/**/*.parquet"
    tables:
      - name: fx
